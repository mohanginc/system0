<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포장 작업 · system0</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand-star.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/order-packing.css">
  <script src="/navigation.js" defer></script>
  <script src="/order-packing.js" defer></script>
</head>
<body class="order-packing">
  <header class="header">
    <a class="brand" href="/" aria-label="system0 홈"><img class="brand-mark" src="/assets/brand-star.svg" alt="" width="34" height="56"> system0</a>
    <nav class="app-nav" aria-label="업무 메뉴"></nav>
  </header>
  <main id="packing" aria-busy="true">
    <div class="pack-heading">
      <div><h1>포장 작업</h1><p id="packing-summary"></p></div>
      <button id="reload-packing" type="button" disabled>새로고침</button>
    </div>
    <div id="pack-message" class="message" role="status" hidden></div>
    <div class="pack-layout">
      <section class="review-card" aria-labelledby="pack-orders-title">
        <div class="pack-section-heading"><h2 id="pack-orders-title">포장할 상품</h2><span id="available-count"></span></div>
        <form id="pack-form">
          <fieldset id="pick-controls" disabled>
            <ul id="available-orders" class="pack-list"></ul>
            <p id="available-empty" class="pack-empty">주문을 불러오는 중입니다.</p>
            <div class="pack-actions"><button id="add-box" type="submit" disabled>새 상자에 담기</button></div>
          </fieldset>
        </form>
      </section>
      <div class="pack-boxes">
        <section id="packing-preview" class="review-card pack-preview" aria-labelledby="packing-preview-title" hidden>
          <div class="pack-section-heading"><h2 id="packing-preview-title">저장할 포장 변경</h2></div>
          <p id="preview-summary" class="pack-summary"></p>
          <fieldset id="preview-controls" disabled>
            <ul id="draft-boxes" class="pack-list"></ul>
            <div class="pack-actions">
              <button id="discard-changes" type="button">변경 취소</button>
              <button id="save-packing" class="primary" type="button">포장 변경 저장</button>
            </div>
          </fieldset>
        </section>
        <section class="review-card" aria-labelledby="saved-boxes-title">
          <div class="pack-section-heading"><h2 id="saved-boxes-title">저장한 상자</h2><span id="saved-count"></span></div>
          <fieldset id="saved-controls" disabled>
            <ul id="saved-boxes" class="pack-list"></ul>
            <p id="saved-empty" class="pack-empty">상자를 불러오는 중입니다.</p>
          </fieldset>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
